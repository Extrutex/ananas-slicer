# Moonraker for the ANANAS SLICER virtual printer rig.
#
# Listens on the container's loopback only and no port is published, so the
# API is reachable solely from inside the moonraker container, where the check
# script runs. Only loopback is trusted; CORS is not enabled.

[server]
host: 127.0.0.1
port: 7125
klippy_uds_address: /printer_data/comms/klippy.sock

[file_manager]
enable_object_processing: False
queue_gcode_uploads: False

[machine]
provider: none
validate_service: False
validate_config: False

[authorization]
trusted_clients:
    127.0.0.0/8
    ::1/128
force_logins: False

[history]
