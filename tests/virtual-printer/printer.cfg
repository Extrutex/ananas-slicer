# Virtual Voron 2.4 350 for the ANANAS SLICER test rig.
#
# Kinematics, travel, Z layout and the module set follow a stock Voron 2.4 350.
# The MCU is the Klipper Linux host-MCU target: pins are its gpioN/analogN
# names. The rig runs Klippy against a data dictionary only (file output to
# /dev/null), so no pin is ever driven and no hardware is required.
# TMC drivers are left out on purpose: their UART/SPI register reads need a
# responding MCU, which file-output mode does not have.

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 7000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 15
max_z_accel: 350

[stepper_x]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 400
endstop_pin: gpio3
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 400
endstop_pin: gpio7
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[stepper_z]
step_pin: gpio8
dir_pin: !gpio9
enable_pin: !gpio10
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: gpio11
position_endstop: -0.5
position_max: 325
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z1]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[stepper_z2]
step_pin: gpio15
dir_pin: !gpio16
enable_pin: !gpio17
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[stepper_z3]
step_pin: gpio18
dir_pin: gpio19
enable_pin: !gpio20
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[extruder]
step_pin: gpio21
dir_pin: gpio22
enable_pin: !gpio23
rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 100
heater_pin: gpio24
sensor_type: ATC Semitec 104GT-2
sensor_pin: analog0
control: pid
pid_Kp: 26.213
pid_Ki: 1.304
pid_Kd: 131.721
min_temp: 10
max_temp: 280
min_extrude_temp: 170
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040

[heater_bed]
heater_pin: gpio25
sensor_type: Generic 3950
sensor_pin: analog1
control: pid
pid_Kp: 58.437
pid_Ki: 2.347
pid_Kd: 363.769
min_temp: 0
max_temp: 120

[probe]
pin: gpio26
x_offset: 0
y_offset: 0
z_offset: 0.0
speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 175,175
speed: 100
z_hop: 10
z_hop_speed: 25

[quad_gantry_level]
gantry_corners:
    -60,-10
    410,420
points:
    50,25
    50,275
    300,275
    300,25
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[fan]
pin: gpio27
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: gpio28
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 58.0
shaper_type_y: mzv
shaper_freq_y: 42.4

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

[gcode_arcs]
resolution: 0.1

[exclude_object]

[virtual_sdcard]
path: /printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[respond]

# The print state macros ANANAS SLICER ships (resources/klipper, mounted by docker-compose.yml).
[include /ananas-slicer/ananas_slicer_state.cfg]

[idle_timeout]
timeout: 1800

# Stub macros for what the Voron profile's start/end G-code and Moonraker
# clients call. They exercise the same motion and heater commands a real
# PRINT_START would (home, gantry level, re-home Z, heat), without purge lines.

[gcode_macro PRINT_START]
description: Home, level the gantry and heat (virtual printer stub)
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(220)|float %}
    M140 S{BED}
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    G1 Z10 F3000
    M190 S{BED}
    M109 S{EXTRUDER}

[gcode_macro PRINT_END]
description: Retract, park and switch off (virtual printer stub)
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set z_safe = [printer.toolhead.position.z + 10, max_z]|min %}
    M400
    G92 E0
    G1 E-2.0 F3600
    G91
    G1 Z{z_safe - printer.toolhead.position.z} F3000
    G90
    G1 X175 Y340 F12000
    TURN_OFF_HEATERS
    M107

[gcode_macro CANCEL_PRINT]
description: Cancel the running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    M107
    CANCEL_PRINT_BASE
    _ANANAS_SLICER_RESTORE
