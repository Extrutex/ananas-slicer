# Config for the state macro check (run.sh step 3): the virtual printer plus
# the pressure advance layouts _KLIPSLICE_RESTORE has to handle.

[include /vp/printer.cfg]

# A second extruder without a stepper of its own: Klipper reads no
# pressure_advance for it, and SET_PRESSURE_ADVANCE does not know its name.
[extruder1]
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: gpio29
sensor_type: ATC Semitec 104GT-2
sensor_pin: analog2
control: pid
pid_Kp: 26.213
pid_Ki: 1.304
pid_Kd: 131.721
min_temp: 10
max_temp: 280

# An extra stepper driving the first extruder's filament, with its own
# pressure advance. The capital letter checks that the macro passes Klipper
# the name as written.
[extruder_stepper Belt]
extruder: extruder
step_pin: gpio30
dir_pin: gpio31
enable_pin: !gpio32
rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
pressure_advance: 0.06
pressure_advance_smooth_time: 0.030

[gcode_macro _VP_EXPECT_PA]
description: Fail unless an extruder stepper has the given pressure advance
gcode:
    {% set name = params.EXTRUDER if params.EXTRUDER is defined else "extruder_stepper " ~ params.STEPPER %}
    {% set obj = printer[name] %}
    {% set want_pa = params.ADVANCE|float %}
    {% set want_st = params.SMOOTH_TIME|float %}
    {% if (obj.pressure_advance - want_pa)|abs > 1e-9 or (obj.smooth_time - want_st)|abs > 1e-9 %}
        {action_raise_error("%s: pressure advance %s / %s, expected %s / %s" % (name, obj.pressure_advance, obj.smooth_time, want_pa, want_st))}
    {% endif %}

[gcode_macro _VP_EXPECT_LIMITS]
description: Fail unless the toolhead has the given velocity limits
gcode:
    {% set th = printer.toolhead %}
    {% for key, param in [("max_velocity", "VELOCITY"), ("max_accel", "ACCEL"), ("minimum_cruise_ratio", "MINIMUM_CRUISE_RATIO"), ("square_corner_velocity", "SQUARE_CORNER_VELOCITY")] %}
        {% if (th[key] - params[param]|float)|abs > 1e-9 %}
            {action_raise_error("toolhead %s %s, expected %s" % (key, th[key], params[param]))}
        {% endif %}
    {% endfor %}

[gcode_macro _VP_EXPECT_HEATERS_OFF]
description: Fail unless every heater is off
gcode:
    {% for name in ["extruder", "extruder1", "heater_bed"] %}
        {% if printer[name].target != 0 %}
            {action_raise_error("%s target %s after CANCEL_PRINT" % (name, printer[name].target))}
        {% endif %}
    {% endfor %}

# Klipper applies a fan speed when the MCU queue reaches its print time, and
# only then reports it (a kick start delays the next change by kick_start_time):
# _VP_EXPECT_FAN_OFF dwells past that and checks in a second macro, whose
# template is evaluated after the dwell.
[gcode_macro _VP_EXPECT_FAN_OFF]
description: Fail unless the part cooling fan is off once pending speed changes have taken effect
gcode:
    G4 P1000
    M400
    _VP_EXPECT_FAN_OFF_NOW

[gcode_macro _VP_EXPECT_FAN_OFF_NOW]
description: Fail unless the part cooling fan reports speed 0
gcode:
    {% if printer.fan.speed != 0 %}
        {action_raise_error("part cooling fan %s after CANCEL_PRINT" % printer.fan.speed)}
    {% endif %}
