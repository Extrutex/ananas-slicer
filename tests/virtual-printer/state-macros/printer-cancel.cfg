# Config for the live cancel check (run.sh step 5): the Mainsail route of the
# state macro check (state-macros/printer-mainsail.cfg: Mainsail's
# CANCEL_PRINT with variable_user_cancel_macro: "_ANANAS_SLICER_RESTORE"), run by
# the long-running Klippy behind Moonraker instead of batch mode, so that
# CANCEL_PRINT stops a print virtual_sdcard is actually running.
# check_cancel.py uploads state-macros/cancel.gcode and cancels it.

[include /vp/state-macros/printer-mainsail.cfg]

# Mainsail's file sets path: ~/printer_data/gcodes; Moonraker's gcodes root
# in the rig is /printer_data/gcodes.
[virtual_sdcard]
path: /printer_data/gcodes

# cancel.gcode keeps printing in an endless SDCARD_LOOP until it is cancelled,
# however fast the file-output MCU runs.
[sdcard_loop]

[gcode_macro _VP_CANCEL_STATE]
description: Progress of cancel.gcode, read by check_cancel.py
variable_reached: False
variable_after: False
gcode:
