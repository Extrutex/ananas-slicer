# Config for the Mainsail route of the state macro check (run.sh step 3):
# state-macros/printer.cfg plus Mainsail's macro file and the cancel hook that
# resources/klipper/ananas_slicer_state.cfg documents for it.
#
# mainsail.cfg is client.cfg of github.com/mainsail-crew/mainsail-config at
# commit ff3869a621db17ce3ef660adbbd3fa321995ac42, copied unchanged (GPLv3, see
# its header). Klipper merges sections of the same name, and the later gcode
# wins: Mainsail's CANCEL_PRINT, read after the rig's, replaces it.
# check-mainsail.gcode verifies that before it relies on it.

[include /vp/state-macros/printer.cfg]

[include /vp/state-macros/mainsail.cfg]

[gcode_macro _CLIENT_VARIABLE]
variable_user_cancel_macro: "_ANANAS_SLICER_RESTORE"
gcode:

[gcode_macro _VP_EXPECT_CLIENT_CANCEL]
description: Fail unless CANCEL_PRINT is the client's macro with its cancel hook, not the rig's
gcode:
    {% set body = printer.configfile.config["gcode_macro CANCEL_PRINT"].gcode %}
    {% if "user_cancel_macro" not in body or "_ANANAS_SLICER_RESTORE" in body %}
        {action_raise_error("CANCEL_PRINT is not the client's macro: %s" % body)}
    {% endif %}
