# Config for the stepper name route of the state macro check (run.sh step 3):
# state-macros/printer.cfg plus extruder steppers whose names Klipper accepts
# in printer.cfg but cannot take back unquoted in an extended G-code
# parameter. Klipper splits SET_PRESSURE_ADVANCE's parameters like a POSIX
# shell: EXTRUDER=Belt'aux has no closing quotation, so the command is
# malformed, and EXTRUDER=Belt\aux arrives as Beltaux, a stepper that does not
# exist. Either error would end _KLIPSLICE_RESTORE before the steppers after
# them; [extruder_stepper Tail] comes last to show that the restore goes on.

[include /vp/state-macros/printer.cfg]

[extruder_stepper Belt'aux]
extruder: extruder
step_pin: gpio33
dir_pin: gpio34
enable_pin: !gpio35
rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
pressure_advance: 0.07
pressure_advance_smooth_time: 0.035

[extruder_stepper Belt\aux]
extruder: extruder
step_pin: gpio36
dir_pin: gpio37
enable_pin: !gpio38
rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
pressure_advance: 0.08
pressure_advance_smooth_time: 0.036

[extruder_stepper Tail]
extruder: extruder
step_pin: gpio39
dir_pin: gpio40
enable_pin: !gpio41
rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
pressure_advance: 0.09
pressure_advance_smooth_time: 0.037
