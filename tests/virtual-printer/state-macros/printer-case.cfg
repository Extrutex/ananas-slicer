# Config for the case collision route of the state macro check (run.sh
# step 3): state-macros/printer.cfg plus a second extruder stepper whose name
# differs from [extruder_stepper Belt] only in case. Klipper keeps both
# steppers apart (SET_PRESSURE_ADVANCE EXTRUDER=Belt and EXTRUDER=belt), but
# configfile.settings lower-cases section names, so it reports one
# pressure_advance for both: _KLIPSLICE_RESTORE cannot tell which value is
# whose and has to leave both alone.

[include /vp/state-macros/printer.cfg]

[extruder_stepper belt]
extruder: extruder
step_pin: gpio33
dir_pin: gpio34
enable_pin: !gpio35
rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
pressure_advance: 0.07
pressure_advance_smooth_time: 0.035
