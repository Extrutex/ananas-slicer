<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ANANAS SLICER: a slicer for Klipper printers, and only for Klipper printers.">
  <title>ANANAS SLICER README hero: the logotype lockup, the tagline, three printer.cfg lines, and the strata wedge signet with layer ticks.</title>
  <!-- ground + 1 px frame -->
  <rect x="0" y="0" width="1200" height="320" fill="#0b0e11"/>
  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#262f37" stroke-width="1"/>

  <!-- official lockup, copied verbatim from resources/images/AnanasSlicer_horizontal_dark.svg;
       scaled 24 u cap height -> 56 px (x 7/3), symbol left edge at x = 60 -->
  <g transform="translate(50.667 29.333) scale(2.3333)">
    <path fill="#b4c0c9" d="M4 10L9 15H4Z M4 17H11L17 23H4Z M5 25H19L25 31H11Z M13 33H27L28 34V39H19Z M21 41H28V48Z M60 10L55 15H60Z M60 17H53L47 23H60Z M59 25H45L39 31H53Z M51 33H37L36 34V39H45Z M43 41H36V48Z"/>
    <path fill="#4db9ff" d="M4 8H11L32 29L53 8H60L34.5 33.5V54L32.5 56H22V51H29.5V33.5Z"/>
    <g fill="#eef3f6" transform="translate(76 20)">
      <path d="M0 0H4V24H0Z M4 7.17L10.57 0H16L4 13.09Z M7.3 9.49L16 24H11.34L4 11.77Z"/>
      <path transform="translate(22 0)" d="M0 0H4V20H13V24H0Z"/>
      <path transform="translate(39 0)" d="M0 0H4V24H0Z"/>
      <path transform="translate(49 0)" d="M0 0H12L15 3V11L12 14H4V24H0Z M4 4V10H11V4Z"/>
      <path transform="translate(70 0)" d="M3 0H15V4H4V10H12L15 13V21L12 24H0V20H11V14H3L0 11V3Z"/>
      <path transform="translate(91 0)" d="M0 0H4V20H13V24H0Z"/>
      <path transform="translate(108 0)" d="M0 0H4V24H0Z"/>
      <path transform="translate(118 0)" d="M3 0H15V4H4V20H15V24H3L0 21V3Z"/>
      <path transform="translate(139 0)" d="M0 0H14V4H4V10H12V14H4V20H14V24H0Z"/>
    </g>
  </g>

  <!-- tagline -->
  <text x="60" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#d8e0e6">A slicer for Klipper printers, and only for Klipper printers.</text>

  <!-- printer.cfg excerpt: keys alu-300, values alu-50 -->
  <g font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#8b99a4">
    <text x="60" y="232">kinematics: <tspan fill="#eef3f6">corexy</tspan></text>
    <text x="60" y="254">max_accel: <tspan fill="#eef3f6">10000</tspan></text>
    <text x="60" y="276">square_corner_velocity: <tspan fill="#eef3f6">5.0</tspan></text>
  </g>

  <!-- hairline between the two thirds -->
  <line x1="760.5" y1="40" x2="760.5" y2="280" stroke="#262f37" stroke-width="1"/>

  <!-- signet S1, strata wedge: u = 9 px, bars 3 u with 1 u gaps, lengths 16/14/12/10/8 u, flush left -->
  <g fill="#eef3f6">
    <rect x="880" y="75" width="144" height="27"/>
    <rect x="880" y="111" width="126" height="27"/>
    <rect x="880" y="147" width="108" height="27"/>
    <rect x="880" y="183" width="90" height="27"/>
    <rect x="880" y="219" width="72" height="27"/>
  </g>

  <!-- layer axis: one tick per bar, labels on the bar centres -->
  <g stroke="#262f37" stroke-width="1" fill="none">
    <line x1="1044.5" y1="88.5" x2="1044.5" y2="232.5"/>
    <line x1="1038" y1="88.5" x2="1044" y2="88.5"/>
    <line x1="1038" y1="124.5" x2="1044" y2="124.5"/>
    <line x1="1038" y1="160.5" x2="1044" y2="160.5"/>
    <line x1="1038" y1="196.5" x2="1044" y2="196.5"/>
    <line x1="1038" y1="232.5" x2="1044" y2="232.5"/>
  </g>
  <g font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b99a4">
    <text x="1054" y="92">layer 5</text>
    <text x="1054" y="128">layer 4</text>
    <text x="1054" y="164">layer 3</text>
    <text x="1054" y="200">layer 2</text>
    <text x="1054" y="236">layer 1</text>
  </g>
</svg>
