<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Linear delta kinematics, front view: three fixed towers with belt-driven carriages A, B and C, parallel arms down to one effector carrying the toolhead over a circular bed.">
  <title>Linear delta kinematics in front view: three fixed towers, one belt-driven carriage per tower, parallel arms down to a single effector carrying the toolhead over a circular bed.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4db9ff"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="800" height="480" fill="#0b0e11"/>
  <rect x="0.5" y="0.5" width="799" height="479" fill="none" stroke="#262f37" stroke-width="1"/>

  <!-- title block -->
  <text x="40" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="2" fill="#eef3f6">DELTA</text>
  <text x="40" y="66" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#8b99a4">kinematics: delta</text>

  <!-- back tower C (behind, drawn first and dimmer) -->
  <rect x="270" y="100" width="20" height="280" fill="#0f1317" stroke="#2e3840" stroke-width="2"/>
  <line x1="280" y1="100" x2="280" y2="380" stroke="#2e3840" stroke-width="4"/>
  <path d="M272 420 V110 A8 8 0 0 1 288 110 V420" fill="none" stroke="#b4c0c9" stroke-width="2"/>
  <circle cx="280" cy="110" r="6" fill="#0b0e11" stroke="#5c6b77" stroke-width="2"/>
  <rect x="266" y="160" width="28" height="20" fill="#b4c0c9"/>
  <line x1="274" y1="180" x2="244" y2="312" stroke="#8b99a4" stroke-width="1.5"/>
  <line x1="286" y1="180" x2="256" y2="312" stroke="#8b99a4" stroke-width="1.5"/>

  <!-- bed (circular, in perspective) -->
  <ellipse cx="280" cy="352" rx="130" ry="24" fill="#141a1f" stroke="#3d4953" stroke-width="2"/>
  <text x="280" y="370" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b99a4">bed, fixed</text>

  <!-- top and bottom plates -->
  <rect x="70" y="80" width="420" height="20" fill="#0f1317" stroke="#3d4953" stroke-width="2"/>
  <rect x="70" y="380" width="420" height="20" fill="#0f1317" stroke="#3d4953" stroke-width="2"/>

  <!-- front tower A (left) -->
  <rect x="88" y="100" width="24" height="280" fill="#0f1317" stroke="#3d4953" stroke-width="2"/>
  <line x1="100" y1="100" x2="100" y2="380" stroke="#3d4953" stroke-width="4"/>
  <path d="M92 420 V110 A8 8 0 0 1 108 110 V420" fill="none" stroke="#eef3f6" stroke-width="2"/>
  <circle cx="100" cy="110" r="6" fill="#0b0e11" stroke="#5c6b77" stroke-width="2"/>
  <rect x="84" y="120" width="32" height="20" fill="#d8e0e6"/>

  <!-- front tower B (right) -->
  <rect x="448" y="100" width="24" height="280" fill="#0f1317" stroke="#3d4953" stroke-width="2"/>
  <line x1="460" y1="100" x2="460" y2="380" stroke="#3d4953" stroke-width="4"/>
  <path d="M452 420 V110 A8 8 0 0 1 468 110 V420" fill="none" stroke="#eef3f6" stroke-width="2"/>
  <circle cx="460" cy="110" r="6" fill="#0b0e11" stroke="#5c6b77" stroke-width="2"/>
  <rect x="444" y="200" width="32" height="20" fill="#d8e0e6"/>

  <!-- motors at the tower bases -->
  <circle cx="100" cy="420" r="12" fill="#222a31" stroke="#5c6b77" stroke-width="2"/>
  <text x="100" y="424" text-anchor="middle" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#eef3f6">A</text>
  <circle cx="280" cy="420" r="12" fill="#222a31" stroke="#5c6b77" stroke-width="2"/>
  <text x="280" y="424" text-anchor="middle" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#eef3f6">C</text>
  <circle cx="460" cy="420" r="12" fill="#222a31" stroke="#5c6b77" stroke-width="2"/>
  <text x="460" y="424" text-anchor="middle" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#eef3f6">B</text>

  <!-- parallel arms from the front carriages -->
  <line x1="94" y1="140" x2="228" y2="312" stroke="#d8e0e6" stroke-width="1.5"/>
  <line x1="106" y1="140" x2="240" y2="312" stroke="#d8e0e6" stroke-width="1.5"/>
  <line x1="454" y1="220" x2="260" y2="312" stroke="#d8e0e6" stroke-width="1.5"/>
  <line x1="466" y1="220" x2="272" y2="312" stroke="#d8e0e6" stroke-width="1.5"/>

  <!-- effector, toolhead, nozzle -->
  <rect x="226" y="312" width="48" height="8" fill="#d8e0e6"/>
  <rect x="244" y="320" width="12" height="12" fill="#eef3f6"/>
  <rect x="248" y="332" width="4" height="3" fill="#eef3f6"/>

  <!-- motion: carriage heights A, B, C -->
  <line x1="70" y1="170" x2="70" y2="110" stroke="#4db9ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="56" y="144" text-anchor="middle" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#4db9ff">A</text>
  <line x1="490" y1="250" x2="490" y2="190" stroke="#4db9ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="504" y="224" text-anchor="middle" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#4db9ff">B</text>
  <line x1="310" y1="210" x2="310" y2="150" stroke="#4db9ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="324" y="184" text-anchor="middle" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#4db9ff">C</text>
  <text x="122" y="134" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b4c0c9">carriage</text>

  <!-- motion: resulting XY at the effector -->
  <line x1="266" y1="350" x2="306" y2="350" stroke="#4db9ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312" y="354" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#4db9ff">X</text>
  <line x1="266" y1="350" x2="286" y2="332" stroke="#4db9ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="292" y="338" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#4db9ff">Y</text>

  <!-- config keys -->
  <text x="560" y="150" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#b4c0c9">[printer]</text>
  <text x="560" y="180" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#b4c0c9">delta_radius</text>
  <text x="560" y="196" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b99a4">tower to centre</text>
  <text x="560" y="226" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#b4c0c9">arm_length</text>
  <text x="560" y="242" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b99a4">carriage to effector</text>
  <text x="560" y="272" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#b4c0c9">max_velocity</text>
  <text x="560" y="290" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#b4c0c9">max_accel</text>
  <text x="560" y="306" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b99a4">one value for all axes</text>

  <!-- legend -->
  <rect x="640" y="404" width="14" height="8" fill="#d8e0e6"/>
  <text x="662" y="412" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b99a4">moves</text>
  <rect x="640" y="424" width="14" height="8" fill="none" stroke="#3d4953" stroke-width="1"/>
  <text x="662" y="432" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b99a4">fixed</text>

  <!-- caption -->
  <text x="40" y="448" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b4c0c9">XY and Z are all solved from the three carriage heights; no per-axis limits, and the printable area is a circle.</text>
</svg>
