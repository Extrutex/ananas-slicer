        --ks-ramp-9: #ebdb5c;
        --ks-ramp-10: #fbe84a;

        --ks-bg-chrome: var(--ks-carbon-950);
        --ks-bg-app: var(--ks-carbon-900);
        --ks-bg-panel: var(--ks-carbon-850);
        --ks-bg-raised: var(--ks-carbon-800);

        --ks-ink-strong: var(--ks-alu-50);

        --ks-font-ui: "Inter", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        --ks-font-data: "IBM Plex Mono", "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e11; /* explicit, in case custom properties fail */
        background: var(--ks-bg-app);
        color: var(--ks-ink);
        font-family: var(--ks-font-ui);
        font-size: 13px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        height: 100%;
      }

      .font-data,
      input[inputmode="decimal"],
      kbd {
        font-family: var(--ks-font-data);
        font-variant-numeric: tabular-nums slashed-zero;
      }

      kbd {
        font-size: inherit;
        color: var(--ks-ink-secondary);
      }

      :focus-visible {
        outline: 2px solid var(--ks-focus);
        outline-offset: 1px;
      }

      /* Over-limit swatch: colour AND pattern, so it survives any colour
         vision deficiency and greyscale screenshots. */
      .ks-hatch {
        background-color: var(--ks-signal-limit-surface);
        background-image: repeating-linear-gradient(
          135deg,
          var(--ks-signal-limit) 0 2px,
          transparent 2px 5px
        );
      }

      .ks-dash {
        background-image: repeating-linear-gradient(
          90deg,
          var(--ks-steel-400) 0 4px,
          transparent 4px 7px
        );
        background-size: 100% 2px;
        background-repeat: no-repeat;
        background-position: center;
      }

      /* Shown only if React/Babel fail to load (offline, blocked CDN). */
      .boot-fallback {
        padding: 24px;
        font-family: var(--ks-font-data);
        color: var(--ks-alu-200);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0ms !important;
        }
      }

              "ks-table": ["12px", { lineHeight: "16px" }],
              "ks-ui": ["13px", { lineHeight: "18px" }],
              "ks-section": ["15px", { lineHeight: "20px" }],

            spacing: { row: "28px", "row-header": "32px", target: "24px", sidebar: "460px" },

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <body>
    <div id="root">
      <p class="boot-fallback">
        Loading preview… If this text stays, React/Babel could not be fetched from cdnjs.cloudflare.com (offline or blocked).
      </p>
    </div>

    <!--
      JSX port of docs/design/preview/KinematicsSidebar.tsx (types stripped,
      logic identical). The .tsx file is the reference; keep both in sync.
    -->
    <script type="text/babel" data-presets="react">
      const { useCallback, useEffect, useId, useMemo, useRef, useState } = React;

      /* ------------------------------------------------------------------ */
      /* Model + formatting (identical to KinematicsSidebar.tsx)            */
      /* ------------------------------------------------------------------ */

      const CAUTION_RATIO = 0.9;

      function evaluateLimit(value, limit) {
        if (limit.kind === "reference") return "reference";
        if (value > limit.value) return "exceeded";
        if (value >= limit.value * CAUTION_RATIO) return "caution";
        return "nominal";
      }

      const GROUP_SEPARATOR = " ";

      function roundTo(value, decimals) {
        const factor = 10 ** decimals;
        return Math.round(value * factor) / factor;
      }

      function formatNumber(value, decimals) {
        const fixed = Math.abs(value).toFixed(decimals);
        const [integer, fraction] = fixed.split(".");
        const grouped = integer.length > 3 ? integer.replace(/\B(?=(\d{3})+(?!\d))/g, GROUP_SEPARATOR) : integer;
        const sign = value < 0 ? "−" : "";
        return fraction !== undefined ? `${sign}${grouped}.${fraction}` : `${sign}${grouped}`;
      }

      const NUMBER_PATTERN = /^-?(\d+\.?\d*|\.\d+)$/;

      function parseNumber(text) {
        const normalised = text.replace(/[\s ]/g, "").replace(",", ".").replace("−", "-");
        if (!NUMBER_PATTERN.test(normalised)) return null;
        const value = Number(normalised);
        return Number.isFinite(value) ? value : null;
      }

      function checkDraft(text, param) {
        const value = parseNumber(text);
        if (value === null) return { ok: false, message: "Not a number." };
        if (value < param.min || value > param.max) {
          return {
            ok: false,
            message: `Outside input range ${formatNumber(param.min, param.decimals)} – ${formatNumber(param.max, param.decimals)} ${param.unit}.`,
          };
        }
        return { ok: true, value: roundTo(value, param.decimals) };
      }

      function stepMultiplier(event) {
        if (event.shiftKey) return 10;
        if (event.altKey) return 0.1;
        return 1;
      }

      function limitMessage(param, state) {
        const { limit, unit, decimals, value } = param;
        const limitText = `${formatNumber(limit.value, decimals)} ${unit}`;
        if (state === "exceeded") {
          const over = formatNumber(roundTo(value - limit.value, decimals), decimals);
          switch (limit.kind) {
            case "machine":
              return `Exceeds ${limit.source} (${limitText}) by ${over}. Klipper does not clamp this value.`;
            case "firmware":
              return `Above Klipper's maximum for ${limit.source} (${limitText}). The command is rejected; a running print stops with an error.`;
            case "profile":
              return `Exceeds ${limit.source} (${limitText}) by ${over}. Klipper does not enforce volumetric flow.`;
            default:
              return null;
          }
        }
        if (state === "caution") {
          const share = Math.round((value / limit.value) * 100);
          return `${share} % of ${limit.source} (${limitText}).`;
        }
        return null;
      }

      /* ------------------------------------------------------------------ */
      /* Stepper auto-repeat                                                */
      /* ------------------------------------------------------------------ */

      const REPEAT_DELAY_MS = 400;
      const REPEAT_INTERVAL_MS = 60;

      function useAutoRepeat(action) {
        const actionRef = useRef(action);
        const multiplierRef = useRef(1);
        const delayRef = useRef(null);
        const intervalRef = useRef(null);

        useEffect(() => {
          actionRef.current = action;
        }, [action]);

        const stop = useCallback(() => {
          if (delayRef.current !== null) window.clearTimeout(delayRef.current);
          if (intervalRef.current !== null) window.clearInterval(intervalRef.current);
          delayRef.current = null;
          intervalRef.current = null;
        }, []);

        const start = useCallback(
          (event) => {
            if (event.button !== 0) return;
            event.preventDefault();
            stop();
            multiplierRef.current = stepMultiplier(event);
            actionRef.current(multiplierRef.current);
            delayRef.current = window.setTimeout(() => {
              intervalRef.current = window.setInterval(() => actionRef.current(multiplierRef.current), REPEAT_INTERVAL_MS);
            }, REPEAT_DELAY_MS);
          },
          [stop],
        );

        useEffect(() => stop, [stop]);
        return { start, stop };
      }

      /* ------------------------------------------------------------------ */
      /* Row                                                                */
      /* ------------------------------------------------------------------ */

      const ROW_GRID = "grid grid-cols-[minmax(0,1fr)_104px_50px_64px] sm:grid-cols-[minmax(0,1fr)_120px_50px_84px] items-center gap-x-2";

      function StepperButton({ direction, param, disabled, onStep }) {
        const action = useCallback((multiplier) => onStep(direction, multiplier), [direction, onStep]);
        const { start, stop } = useAutoRepeat(action);

        useEffect(() => {
          if (disabled) stop();
        }, [disabled, stop]);

        const verb = direction === 1 ? "Increase" : "Decrease";
        return (
          <button
            type="button"
            tabIndex={-1}
            disabled={disabled}
            aria-label={`${verb} ${param.label} by ${formatNumber(param.step, param.decimals)} ${param.unit}`}
            title={`${verb} · Shift ×10 · Alt ×0.1`}
            onPointerDown={start}
            onPointerUp={stop}
            onPointerLeave={stop}
            onPointerCancel={stop}
            className="flex h-target w-target items-center justify-center rounded border border-edge bg-surface-raised font-data text-ks-ui leading-none text-ink-secondary transition-colors duration-fast hover:border-edge-strong hover:bg-surface-hover hover:text-ink-strong active:bg-carbon-700 disabled:cursor-not-allowed disabled:text-ink-disabled"
          >
            {direction === 1 ? "+" : "−"}
          </button>
        );
      }

      function ParamRow({ param, onValueChange }) {
        const inputId = useId();
        const messageId = useId();
        const [draft, setDraft] = useState(null);

        const draftCheck = draft === null ? null : checkDraft(draft, param);
        const invalidMessage = draftCheck && !draftCheck.ok ? draftCheck.message : null;
        const state = evaluateLimit(param.value, param.limit);
        const message = invalidMessage ?? limitMessage(param, state);
        const rawValue = param.value.toFixed(param.decimals);
        const isEditing = draft !== null;

        const commit = useCallback(
          (value) => {
            const next = roundTo(value, param.decimals);
            if (next !== param.value) onValueChange(param.id, next);
            return next;
          },
          [onValueChange, param.decimals, param.id, param.value],
        );

        const stepBy = useCallback(
          (direction, multiplier) => {
            const base = draftCheck && draftCheck.ok ? draftCheck.value : param.value;
            const target = Math.min(param.max, Math.max(param.min, base + direction * param.step * multiplier));
            const next = commit(target);
            if (isEditing) setDraft(next.toFixed(param.decimals));
          },
          [commit, draftCheck, isEditing, param.decimals, param.max, param.min, param.step, param.value],
        );

        const handleKeyDown = (event) => {
          switch (event.key) {
            case "ArrowUp":
              event.preventDefault();
              stepBy(1, stepMultiplier(event));
              break;
            case "ArrowDown":
              event.preventDefault();
              stepBy(-1, stepMultiplier(event));
              break;
            case "PageUp":
              event.preventDefault();
              stepBy(1, 10);
              break;
            case "PageDown":
              event.preventDefault();
              stepBy(-1, 10);
              break;
            case "Enter":
              if (draftCheck && draftCheck.ok) {
                const next = commit(draftCheck.value);
                setDraft(next.toFixed(param.decimals));
              }
              break;
            case "Escape":
              event.preventDefault();
              setDraft(rawValue);
              break;
            default:
              break;
          }
        };

        const handleBlur = () => {
          if (draftCheck && draftCheck.ok) {
            commit(draftCheck.value);
            setDraft(null);
          }
        };

        const errorish = invalidMessage !== null || state === "exceeded";
        const barClass = errorish ? "bg-signal-limit" : state === "caution" ? "bg-signal-caution" : "bg-transparent";
        const rowSurface = state === "exceeded" && !invalidMessage ? "bg-signal-limit-surface" : "hover:bg-surface-hover";
        const valueInk = errorish ? "text-signal-limit" : "text-ink-strong";
        const fieldEdge = errorish ? "border-signal-limit" : "border-edge-field";
        const limitInk =
          state === "exceeded" ? "font-semibold text-signal-limit" : state === "caution" ? "text-signal-caution" : "text-ink-muted";
        const limitPrefix =
          param.limit.kind === "reference" ? (param.value === param.limit.value ? "cfg" : "≠ cfg") : "≤";
        const messageTag = invalidMessage ? "INVALID" : state === "exceeded" ? "LIMIT" : state === "caution" ? "NEAR" : null;
        const messageInk = errorish ? "text-signal-limit" : "text-signal-caution";
        const messageTagClass = errorish
          ? "bg-signal-limit text-ink-on-signal"
          : "border border-signal-caution text-signal-caution";

        return (
          <div className={`relative border-b border-edge-subtle transition-colors duration-fast ${rowSurface}`}>
            <span aria-hidden="true" className={`absolute inset-y-0 left-0 w-[3px] ${barClass}`} />
            <div className={`${ROW_GRID} min-h-[28px] pl-4 pr-3`}>
              <label htmlFor={inputId} title={param.configKey} className="truncate text-ks-table text-ink-secondary">
                {param.label}
              </label>

              <div
                className={`flex h-target items-center rounded border bg-surface-field focus-within:outline focus-within:outline-2 focus-within:outline-offset-1 focus-within:outline-edge-focus ${fieldEdge}`}
              >
                <input
                  id={inputId}
                  type="text"
                  inputMode="decimal"
                  autoComplete="off"
                  spellCheck={false}
                  aria-invalid={errorish}
                  aria-describedby={message ? messageId : undefined}
                  value={draft ?? formatNumber(param.value, param.decimals)}
                  onFocus={(event) => {
                    setDraft(rawValue);
                    event.currentTarget.select();
                  }}
                  onChange={(event) => setDraft(event.target.value)}
                  onKeyDown={handleKeyDown}
                  onBlur={handleBlur}
                  className={`h-full min-w-0 flex-1 bg-transparent pl-2 text-right font-data text-ks-table tabular-nums outline-none ${valueInk}`}
                />
                <span className="w-[6ch] shrink-0 pl-1.5 font-data text-ks-table text-ink-muted" aria-hidden="true">
                  {param.unit}
                </span>
              </div>

              <div className="flex gap-0.5">
                <StepperButton direction={-1} param={param} disabled={param.value <= param.min} onStep={stepBy} />
                <StepperButton direction={1} param={param} disabled={param.value >= param.max} onStep={stepBy} />
              </div>

              <span
                title={`${param.limit.source} = ${formatNumber(param.limit.value, param.decimals)} ${param.unit}`}
                className={`truncate text-right font-data text-ks-table tabular-nums ${limitInk}`}
              >
                <span className="text-ink-muted">{limitPrefix} </span>
                {formatNumber(param.limit.value, param.decimals)}
              </span>
            </div>

            {message && messageTag ? (
              <p id={messageId} className={`m-0 flex items-start gap-2 pb-2 pl-4 pr-3 text-ks-table ${messageInk}`}>
                <span className={`mt-px shrink-0 rounded px-1 font-data text-ks-micro font-semibold ${messageTagClass}`}>
                  {messageTag}
                </span>
                <span>{message}</span>
              </p>
            ) : null}
          </div>
        );
      }

      /* ------------------------------------------------------------------ */
      /* Group + sidebar                                                    */
      /* ------------------------------------------------------------------ */

      function countStates(params) {
        let exceeded = 0;
        let caution = 0;
        for (const param of params) {
          const state = evaluateLimit(param.value, param.limit);
          if (state === "exceeded") exceeded += 1;
          else if (state === "caution") caution += 1;
        }
        return { exceeded, caution };
      }

      function sharedSource(params) {
        const first = params[0] ? params[0].limit.source : null;
        return first && params.every((param) => param.limit.source === first) ? first : null;
      }

      function GroupSection({ group, expanded, onToggle, onValueChange }) {
        const regionId = useId();
        const { exceeded, caution } = countStates(group.params);
        const source = sharedSource(group.params);

        return (
          <section>
            <h3 className="m-0">
              <button
                type="button"
                aria-expanded={expanded}
                aria-controls={regionId}
                onClick={() => onToggle(group.id)}
                className="flex h-row-header w-full items-center gap-2 border-b border-edge bg-surface-raised px-3 text-left transition-colors duration-fast hover:bg-surface-hover"
              >
                <span
                  aria-hidden="true"
                  className={`inline-block w-3 text-ks-micro text-ink-muted transition-transform duration-fast ${expanded ? "rotate-90" : ""}`}
                >
                  {"▸"}
                </span>
                <span className="text-ks-ui font-semibold text-ink">{group.title}</span>
                <span className="font-data text-ks-table text-ink-muted">{group.params.length}</span>
                <span className="ml-auto flex min-w-0 items-center gap-1.5">
                  {source ? (
                    <span className="truncate font-data text-ks-table text-ink-muted" title="Limit source">
                      {source}
                    </span>
                  ) : null}
                  {exceeded > 0 ? (
                    <span className="shrink-0 rounded bg-signal-limit px-1.5 font-data text-ks-micro font-semibold text-ink-on-signal">
                      {exceeded} OVER
                    </span>
                  ) : null}
                  {caution > 0 ? (
                    <span className="shrink-0 rounded border border-signal-caution px-1.5 font-data text-ks-micro font-semibold text-signal-caution">
                      {caution} NEAR
                    </span>
                  ) : null}
                </span>
              </button>
            </h3>
            <div id={regionId} role="group" aria-label={group.title} hidden={!expanded}>
              {group.params.map((param) => (
                <ParamRow key={param.id} param={param} onValueChange={onValueChange} />
              ))}
            </div>
          </section>
        );
      }

      function KinematicsSidebar({ groups, onValueChange, machineLabel, configSource, exampleData = false, initiallyCollapsed = [] }) {
        const [collapsed, setCollapsed] = useState(() => new Set(initiallyCollapsed));

        const toggle = useCallback((groupId) => {
          setCollapsed((previous) => {
            const next = new Set(previous);
            if (next.has(groupId)) next.delete(groupId);
            else next.add(groupId);
            return next;
          });
        }, []);

        const totals = useMemo(() => countStates(groups.flatMap((group) => group.params)), [groups]);

        return (
          <aside
            aria-label="Kinematics parameters"
            className="flex w-full shrink-0 flex-col border-b border-edge bg-surface-panel font-ui text-ink lg:h-full lg:w-sidebar lg:border-b-0 lg:border-r"
          >
            <header className="border-b border-edge px-3 py-2.5">
              <div className="flex items-baseline justify-between gap-2">
                <h2 className="m-0 text-ks-section font-semibold text-ink-strong">Kinematics</h2>
                {exampleData ? (
                  <span className="rounded border border-edge-strong px-1.5 font-data text-ks-micro text-ink-muted">EXAMPLE DATA</span>
                ) : null}
              </div>
              <p className="m-0 mt-0.5 truncate font-data text-ks-table text-ink-muted">
                {machineLabel} · {configSource}
              </p>
              <p
                role="status"
                aria-live="polite"
                className={`m-0 mt-2 text-ks-table ${totals.exceeded > 0 ? "text-signal-limit" : totals.caution > 0 ? "text-signal-caution" : "text-ink-muted"}`}
              >
                {totals.exceeded > 0
                  ? `${totals.exceeded} parameter${totals.exceeded === 1 ? "" : "s"} exceed${totals.exceeded === 1 ? "s" : ""} a machine limit. Export requires explicit acknowledgement.`
                  : totals.caution > 0
                    ? `All values within limits · ${totals.caution} within 10 % of a limit.`
                    : "All values within limits."}
              </p>
            </header>

            <div
              aria-hidden="true"
              className={`${ROW_GRID} h-6 border-b border-edge bg-surface-panel pl-4 pr-3 font-ui text-ks-micro uppercase text-ink-muted`}
            >
              <span>Parameter</span>
              <span className="text-right">Value · unit</span>
              <span className="text-center">Step</span>
              <span className="text-right">Limit</span>
            </div>

            <div className="min-h-0 flex-1 overflow-y-auto">
              {groups.map((group) => (
                <GroupSection
                  key={group.id}
                  group={group}
                  expanded={!collapsed.has(group.id)}
                  onToggle={toggle}
                  onValueChange={onValueChange}
                />
              ))}
            </div>

            <footer className="border-t border-edge px-3 py-2 font-data text-ks-micro text-ink-muted">
              <kbd>↑</kbd>/<kbd>↓</kbd> step · <kbd>Shift</kbd> ×10 · <kbd>Alt</kbd> ×0.1 · <kbd>Enter</kbd> apply · <kbd>Esc</kbd> revert
            </footer>
          </aside>
        );
      }

      /* ------------------------------------------------------------------ */
      /* Example data (not read from any machine)                           */
      /* ------------------------------------------------------------------ */

      const MAX_ACCEL = { value: 10000, source: "printer.max_accel", kind: "machine" };

      function accel(id, label, configKey, value) {
        return { id, label, configKey, unit: "mm/s²", value, step: 100, decimals: 0, min: 0, max: 50000, limit: MAX_ACCEL };
      }

      const DEMO_GROUPS = [
        {
          id: "acceleration",
          title: "Acceleration",
          params: [
            accel("accel-outer-wall", "Outer wall", "outer_wall_acceleration", 3000),
            accel("accel-inner-wall", "Inner wall", "inner_wall_acceleration", 6000),
            accel("accel-infill", "Sparse infill", "sparse_infill_acceleration", 12000),
            accel("accel-top", "Top surface", "top_surface_acceleration", 2500),
            accel("accel-travel", "Travel", "travel_acceleration", 9500),
            accel("accel-first-layer", "First layer", "initial_layer_acceleration", 1500),
          ],
        },
        {
          id: "cornering",
          title: "Cornering",
          params: [
            {
              id: "scv", label: "Square corner velocity", configKey: "square_corner_velocity", unit: "mm/s",
              value: 5, step: 0.5, decimals: 1, min: 0, max: 50,
              limit: { value: 8, source: "printer.square_corner_velocity", kind: "machine" },
            },
          ],
        },
        {
          id: "flow",
          title: "Volumetric flow",
          params: [
            {
              id: "max-flow", label: "Max volumetric flow", configKey: "filament_max_volumetric_speed", unit: "mm³/s",
              value: 18, step: 0.5, decimals: 1, min: 0, max: 100,
              limit: { value: 24, source: "hotend.max_volumetric_flow", kind: "profile" },
            },
          ],
        },
        {
          id: "pressure-advance",
          title: "Pressure advance",
          params: [
            {
              id: "pa", label: "Pressure advance", configKey: "pressure_advance", unit: "s",
              value: 0.035, step: 0.001, decimals: 3, min: 0, max: 1,
              limit: { value: 0.04, source: "extruder.pressure_advance", kind: "reference" },
            },
            {
              id: "pa-smooth", label: "Smooth time", configKey: "pressure_advance_smooth_time", unit: "s",
              value: 0.04, step: 0.005, decimals: 3, min: 0, max: 1,
              limit: { value: 0.2, source: "extruder.pressure_advance_smooth_time", kind: "firmware" },
            },
          ],
        },
      ];

      /* ------------------------------------------------------------------ */
      /* Viewport placeholder: synthetic plate, coloured by the ramp        */
      /* ------------------------------------------------------------------ */

      const RAMP = ["#4b62a8", "#5a6ea6", "#6a7aa2", "#7b879e", "#8d9599", "#a0a393", "#b3b18a", "#c6bf7e", "#d9cd6e", "#ebdb5c", "#fbe84a"];

      // Synthetic role table: base speed + which sidebar parameter sets the accel.
      const ROLES = {
        first: { speed: 40, accelId: "accel-first-layer" },
        outer: { speed: 150, accelId: "accel-outer-wall" },
        inner: { speed: 250, accelId: "accel-inner-wall" },
        infill: { speed: 300, accelId: "accel-infill" },
        top: { speed: 120, accelId: "accel-top" },
      };

      const LINE_CROSS_SECTION = 0.45 * 0.2; // mm², 0.45 mm line × 0.2 mm layer
      const MAX_VELOCITY = { value: 350, source: "printer.max_velocity" }; // example value
      const LAYER_HEIGHT = 0.2;
      const PLATE = [
        { id: "a", x: 190, width: 400, layers: 30, segments: 12 },
        { id: "b", x: 640, width: 80, layers: 12, segments: 4 },
      ];
      const ACTIVE = { object: "a", layer: 21, segment: 5 };
      const VIEW = { baseY: 440, layerPx: 10 };

      function roleFor(layer, segment, object) {
        if (layer === 0) return "first";
        if (layer >= object.layers - 3) return "top";
        if (segment === 0 || segment === object.segments - 1) return "outer";
        if (object.segments > 4 && (segment === 1 || segment === object.segments - 2)) return "inner";
        return object.segments > 4 ? "infill" : "inner";
      }

      function modeSpec(mode, params) {
        if (mode === "speed") return { label: "Speed", unit: "mm/s", decimals: 0, limit: MAX_VELOCITY.value, source: MAX_VELOCITY.source };
        if (mode === "flow") {
          const flow = params["max-flow"];
          return { label: "Flow", unit: "mm³/s", decimals: 1, limit: flow.limit.value, source: flow.limit.source };
        }
        return { label: "Accel", unit: "mm/s²", decimals: 0, limit: MAX_ACCEL.value, source: MAX_ACCEL.source };
      }

      function segmentValue(mode, role, params) {
        // Volumetric cap: the slicer lowers speed so flow never exceeds the
        // configured max volumetric flow — same rule OrcaSlicer applies.
        const speedCap = params["max-flow"].value / LINE_CROSS_SECTION;
        const speed = Math.min(ROLES[role].speed, speedCap);
        if (mode === "speed") return speed;
        if (mode === "flow") return speed * LINE_CROSS_SECTION;
        return params[ROLES[role].accelId].value;
      }

      function buildPlate(mode, params) {
        const spec = modeSpec(mode, params);
        const segments = [];
        for (const object of PLATE) {
          const segWidth = object.width / object.segments;
          for (let layer = 0; layer < object.layers; layer += 1) {
            for (let segment = 0; segment < object.segments; segment += 1) {
              const role = roleFor(layer, segment, object);
              const value = segmentValue(mode, role, params);
              segments.push({
                key: `${object.id}-${layer}-${segment}`,
                object: object.id,
                layer,
                segment,
                x: object.x + segment * segWidth,
                width: segWidth,
                value,
                over: value > spec.limit,
              });
            }
          }
        }
        const inRange = segments.filter((s) => !s.over).map((s) => s.value);
        const min = inRange.length ? Math.min(...inRange) : 0;
        const max = inRange.length ? Math.max(...inRange) : 0;
        const overCount = segments.filter((s) => s.over).length;
        return { spec, segments, min, max, overCount };
      }

      function rampIndex(value, min, max) {
        if (max === min) return 5;
        const t = (value - min) / (max - min);
        return Math.max(0, Math.min(10, Math.round(t * 10)));
      }

      function Viewport({ mode, plate }) {
        const visible = plate.segments.filter((s) => !(s.object === ACTIVE.object && s.layer > ACTIVE.layer));
        const activeObject = PLATE.find((o) => o.id === ACTIVE.object);
        const activeSeg = plate.segments.find(
          (s) => s.object === ACTIVE.object && s.layer === ACTIVE.layer && s.segment === ACTIVE.segment,
        );
        const layerY = (layer) => VIEW.baseY - (layer + 1) * VIEW.layerPx;
        const objectB = PLATE[1];
        const gridX = [];
        for (let x = 70; x <= 760; x += 40) gridX.push(x);

        return (
          <svg
            viewBox="0 0 820 500"
            preserveAspectRatio="xMidYMid meet"
            className="h-full w-full"
            role="img"
            aria-label={`Viewport placeholder: side elevation of a synthetic plate coloured by ${plate.spec.label.toLowerCase()}`}
          >
            <defs>
              <pattern id="ks-over" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="6" height="6" fill="#2a1513" />
                <rect width="2.5" height="6" fill="#ff6f5e" />
              </pattern>
            </defs>

            {/* bed + grid */}
            {gridX.map((x) => (
              <line key={x} x1={x} x2={x} y1={VIEW.baseY + 2} y2={VIEW.baseY + 8} stroke="#2e3840" strokeWidth="1" />
            ))}
            <line x1="60" x2="770" y1={VIEW.baseY + 1} y2={VIEW.baseY + 1} stroke="#3d4953" strokeWidth="2" />
            <text x="60" y={VIEW.baseY + 26} fill="#8b99a4" fontFamily="IBM Plex Mono, monospace" fontSize="11">
              X 0
            </text>
            <text x="770" y={VIEW.baseY + 26} fill="#8b99a4" fontFamily="IBM Plex Mono, monospace" fontSize="11" textAnchor="end">
              350 mm
            </text>

            {/* extrusions */}
            {visible.map((s) => (
              <rect
                key={s.key}
                x={s.x + 0.5}
                y={layerY(s.layer) + 1}
                width={s.width - 1}
                height={VIEW.layerPx - 2}
                fill={s.over ? "url(#ks-over)" : RAMP[rampIndex(s.value, plate.min, plate.max)]}
              />
            ))}

            {/* travel moves between objects (dashed) */}
            {Array.from({ length: objectB.layers }, (_, layer) => (
              <line
                key={`travel-${layer}`}
                x1={activeObject.x + activeObject.width}
                x2={objectB.x}
                y1={layerY(layer) + 1}
                y2={layerY(layer) + 1}
                stroke="#5c6b77"
                strokeWidth="1"
                strokeDasharray="4 3"
              />
            ))}

            {/* active G-code path: the only use of --ks-signal-path in the viewport */}
            {activeSeg ? (
              <g>
                <rect
                  x={activeSeg.x}
                  y={layerY(ACTIVE.layer)}
                  width={activeSeg.width}
                  height={VIEW.layerPx}
                  fill="none"
                  stroke="#4db9ff"
                  strokeWidth="2.5"
                />
                <path
                  d={`M ${activeSeg.x + activeSeg.width} ${layerY(ACTIVE.layer) - 4} l -6 -12 h 12 z`}
                  fill="#4db9ff"
                />
                <line
                  x1={activeSeg.x + activeSeg.width}
                  x2={activeSeg.x + activeSeg.width}
                  y1="40"
                  y2={layerY(ACTIVE.layer) - 16}
                  stroke="#4db9ff"
                  strokeWidth="1"
                  strokeDasharray="2 3"
                />
                <text
                  x={activeSeg.x + activeSeg.width + 8}
                  y="52"
                  fill="#eef3f6"
                  fontFamily="IBM Plex Mono, monospace"
                  fontSize="11"
                >
                  {`L ${ACTIVE.layer + 1}/${activeObject.layers} · Z ${((ACTIVE.layer + 1) * LAYER_HEIGHT).toFixed(2)} · ${formatNumber(activeSeg.value, plate.spec.decimals)} ${plate.spec.unit}`}
                </text>
              </g>
            ) : null}
          </svg>
        );
      }

      function HeatmapLegend({ mode, onModeChange, plate }) {
        const { spec, min, max, overCount } = plate;
        const mid = (min + max) / 2;
        const modes = [
          { id: "speed", label: "Speed" },
          { id: "flow", label: "Flow" },
          { id: "accel", label: "Accel" },
        ];
        return (
          <div className="w-full max-w-[340px] border border-edge bg-surface-panel p-3" role="group" aria-label="Heatmap legend">
            <div className="flex items-center justify-between gap-2">
              <span className="text-ks-micro uppercase text-ink-muted">Colour scale</span>
              <div className="flex" role="group" aria-label="Colour scale quantity">
                {modes.map((m) => {
                  const active = m.id === mode;
                  return (
                    <button
                      key={m.id}
                      type="button"
                      aria-pressed={active}
                      onClick={() => onModeChange(m.id)}
                      className={`h-target border px-2.5 text-ks-table transition-colors duration-fast first:rounded-l last:rounded-r -ml-px first:ml-0 ${
                        active
                          ? "z-10 border-edge-strong bg-surface-hover font-semibold text-ink-strong"
                          : "border-edge bg-surface-raised text-ink-muted hover:text-ink"
                      }`}
                    >
                      {m.label}
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="mt-3 flex h-3 gap-px" aria-hidden="true">
              {RAMP.map((color, i) => (
                <span key={i} className="flex-1" style={{ backgroundColor: color }} />
              ))}
            </div>
            <div className="mt-1 flex justify-between font-data text-ks-table tabular-nums text-ink-secondary">
              <span>{formatNumber(min, spec.decimals)}</span>
              <span>{formatNumber(mid, spec.decimals)}</span>
              <span>{formatNumber(max, spec.decimals)}</span>
            </div>
            <div className="mt-0.5 text-right font-data text-ks-micro text-ink-muted">{spec.unit} · 11 bins · plate range</div>

            <ul className="m-0 mt-3 list-none space-y-1.5 p-0 text-ks-table">
              <li className="flex items-center gap-2">
                <span className="ks-hatch h-3 w-6 shrink-0" aria-hidden="true" />
                <span className={overCount > 0 ? "text-signal-limit" : "text-ink-secondary"}>
                  Over limit &gt; <span className="font-data tabular-nums">{formatNumber(spec.limit, spec.decimals)}</span> {spec.unit}
                </span>
                <span className={`ml-auto font-data tabular-nums ${overCount > 0 ? "font-semibold text-signal-limit" : "text-ink-muted"}`}>
                  {overCount} seg
                </span>
              </li>
              <li className="flex items-center gap-2 pl-8 font-data text-ks-micro text-ink-muted">{spec.source}</li>
              <li className="flex items-center gap-2">
                <span className="ks-dash h-3 w-6 shrink-0" aria-hidden="true" />
                <span className="text-ink-secondary">Travel</span>
              </li>
              <li className="flex items-center gap-2">
                <span className="h-3 w-6 shrink-0 border-2 border-signal-path" aria-hidden="true" />
                <span className="text-ink-secondary">Active G-code path</span>
              </li>
            </ul>
          </div>
        );
      }

      /* ------------------------------------------------------------------ */
      /* Moonraker metric tiles                                             */
      /* ------------------------------------------------------------------ */

      function MetricTile({ label, source, value, decimals, unit, target, state, staleSeconds }) {
        const bar = state === "limit" ? "bg-signal-limit" : state === "stale" ? "bg-signal-caution" : "bg-transparent";
        const valueInk = state === "limit" ? "text-signal-limit" : state === "stale" || state === "offline" ? "text-ink-muted" : "text-ink-strong";
        return (
          <div className="relative min-w-[140px] flex-1 border border-edge bg-surface-panel px-3 pb-2 pt-2.5">
            <span aria-hidden="true" className={`absolute inset-x-0 top-0 h-[2px] ${bar}`} />
            <div className="flex items-baseline justify-between gap-2">
              <span className="text-ks-micro uppercase text-ink-muted">{label}</span>
              {state === "stale" ? (
                <span className="rounded border border-signal-caution px-1 font-data text-ks-micro text-signal-caution">
                  STALE {staleSeconds} s
                </span>
              ) : null}
              {state === "offline" ? (
                <span className="rounded border border-edge-strong px-1 font-data text-ks-micro text-ink-muted">NO LINK</span>
              ) : null}
            </div>
            <div className="mt-1 flex items-baseline gap-1.5">
              <span className={`font-data text-ks-metric font-medium tabular-nums ${valueInk}`}>
                {state === "offline" ? "—" : formatNumber(value, decimals)}
              </span>
              <span className="font-data text-ks-table text-ink-muted">{unit}</span>
              {target !== undefined && state !== "offline" ? (
                <span className="ml-auto font-data text-ks-table tabular-nums text-ink-secondary">
                  → {formatNumber(target, decimals)}
                </span>
              ) : null}
            </div>
            <div className="mt-0.5 truncate font-data text-ks-micro text-ink-muted">{source}</div>
          </div>
        );
      }

      /* ------------------------------------------------------------------ */
      /* Signet S1 "Strata" (see BRAND.md §1.3)                             */
      /* ------------------------------------------------------------------ */

      function StrataSignet({ size = 18 }) {
        // 5 bars, height 3u, gap 1u, lengths 16/14/12/10/8u on a 16u grid.
        const bars = [16, 14, 12, 10, 8];
        return (
          <svg width={size} height={size} viewBox="0 0 16 19" aria-hidden="true">
            {bars.map((len, i) => (
              <rect key={i} x="0" y={i * 4} width={len} height="3" fill="#eef3f6" />
            ))}
          </svg>
        );
      }

      /* ------------------------------------------------------------------ */
      /* App shell                                                          */
      /* ------------------------------------------------------------------ */

      function App() {
        const [groups, setGroups] = useState(DEMO_GROUPS);
        const [mode, setMode] = useState("accel");

        const handleValueChange = useCallback((paramId, value) => {
          setGroups((previous) =>
            previous.map((group) => ({
              ...group,
              params: group.params.map((param) => (param.id === paramId ? { ...param, value } : param)),
            })),
          );
        }, []);

        const params = useMemo(() => {
          const map = {};
          for (const group of groups) for (const param of group.params) map[param.id] = param;
          return map;
        }, [groups]);

        const plate = useMemo(() => buildPlate(mode, params), [mode, params]);
        const totals = useMemo(() => countStates(groups.flatMap((g) => g.params)), [groups]);

        return (
          <div className="flex min-h-full flex-col bg-surface-app font-ui text-ink lg:h-full lg:min-h-[640px]">
            {/* chrome */}
            <header className="flex min-h-11 shrink-0 flex-wrap items-center gap-x-4 gap-y-2 border-b border-edge bg-surface-chrome px-4 py-2 lg:px-3">
              <div className="flex items-center gap-2.5">
                <StrataSignet />
                <span className="font-ui text-ks-ui font-semibold tracking-[0.18em] text-ink-strong">ANANAS SLICER</span>
              </div>
              <nav className="hidden h-full items-stretch md:flex" aria-label="Workspace">
                {["Prepare", "Preview", "Machine"].map((tab) => (
                  <span
                    key={tab}
                    aria-current={tab === "Preview" ? "page" : undefined}
                    className={`flex items-center border-b-2 px-3 text-ks-ui ${
                      tab === "Preview" ? "border-alu-50 text-ink-strong" : "border-transparent text-ink-muted"
                    }`}
                  >
                    {tab}
                  </span>
                ))}
              </nav>
              <span className="ml-auto hidden font-data text-ks-table text-ink-muted xl:inline">design preview · static, no machine connected</span>
              <button
                type="button"
                className="h-7 rounded border border-edge-strong bg-surface-raised px-3 text-ks-ui text-ink hover:bg-surface-hover"
              >
                Export G-code
                {totals.exceeded > 0 ? (
                  <span className="ml-2 rounded bg-signal-limit px-1 font-data text-ks-micro font-semibold text-ink-on-signal">
                    {totals.exceeded} LIMIT
                  </span>
                ) : null}
              </button>
              <button
                type="button"
                className="h-7 rounded bg-alu-50 px-3 text-ks-ui font-semibold text-carbon-950 hover:bg-alu-100"
              >
                Slice plate
              </button>
            </header>

            <div className="flex min-h-0 flex-1 flex-col lg:flex-row">
              <KinematicsSidebar
                groups={groups}
                onValueChange={handleValueChange}
                machineLabel="Voron 2.4 350"
                configSource="printer.cfg"
                exampleData
              />

              <main className="relative flex min-w-0 flex-1 flex-col bg-surface-viewport">
                <section aria-label="Live machine metrics" className="border-b border-edge bg-surface-app px-3 py-2">
                  <div className="mb-1.5 flex items-baseline gap-2">
                    <span className="text-ks-micro uppercase text-ink-muted">Moonraker</span>
                    <span className="font-data text-ks-table text-ink-muted">voron24.local:7125</span>
                    <span className="rounded border border-edge-strong px-1 font-data text-ks-micro text-ink-muted">DEMO VALUES</span>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <MetricTile label="Extruder" source="extruder.temperature" value={249.6} target={250} decimals={1} unit="°C" state="live" />
                    <MetricTile label="Bed" source="heater_bed.temperature" value={110.1} target={110} decimals={1} unit="°C" state="live" />
                    <MetricTile label="Effective accel" source="toolhead.max_accel" value={params["accel-infill"].value} decimals={0} unit="mm/s²" state={params["accel-infill"].value > MAX_ACCEL.value ? "limit" : "live"} />
                    <MetricTile label="Chamber" source="temperature_sensor chamber" value={47.8} decimals={1} unit="°C" state="stale" staleSeconds={6} />
                  </div>
                </section>

                <div className="relative min-h-[260px] flex-1">
                  <div className="absolute inset-0 p-4">
                    <Viewport mode={mode} plate={plate} />
                  </div>
                  <span className="absolute right-3 top-3 font-data text-ks-micro text-ink-muted">
                    VIEWPORT PLACEHOLDER · side elevation · synthetic plate
                  </span>
                </div>

                {/* Legend is docked, not floated: it must never cover the toolpaths it explains. */}
                <div className="flex shrink-0 flex-col items-start gap-4 border-t border-edge bg-surface-app px-4 py-3 sm:flex-row lg:px-3">
                  <HeatmapLegend mode={mode} onModeChange={setMode} plate={plate} />
                  <p className="m-0 max-w-[360px] text-ks-table text-ink-muted">
                    The ramp is binned into 11 steps over the plate's in-limit range. Values above the limit leave the
                    ramp entirely and are drawn hatched in the limit colour. Try raising <span className="font-data text-ink-secondary">Max volumetric flow</span> above 24 mm³/s and switch to Flow, or set <span className="font-data text-ink-secondary">Sparse infill</span> to 10 000 mm/s² in Accel.
                  </p>
                </div>
              </main>
            </div>

            <footer className="flex h-6 shrink-0 items-center gap-4 border-t border-edge bg-surface-chrome px-3 font-data text-ks-micro text-ink-muted">
              <span>plate 1 · 2 objects</span>
              <span>layer {LAYER_HEIGHT.toFixed(2)} mm · line 0.45 mm</span>
              <span className="ml-auto">tokens: docs/design/tokens.css</span>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
