name: Feature request
description: Suggest a change or an addition
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ANANAS SLICER has one scope: printers that run Klipper, reached through Moonraker. Requests that need another firmware, another print host or a cloud service are out of scope and will be closed with a short note.

        Not sure yet? Start a thread in [Discussions](https://github.com/Extrutex/ananas-slicer/discussions) first; requests that grew out of a discussion are the ones most likely to be built. Code changes are accepted only after the maintainer agreed to them in an issue (see CONTRIBUTING.md).
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I have searched the existing issues and discussions
          required: true
        - label: This works with Klipper and Moonraker alone (no other firmware, host or cloud)
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Slicing (walls, infill, supports, seams, bridges)
        - G-code and Klipper (macros, limits, pressure advance, retraction)
        - Moonraker and Device tab (upload, printing, discovery)
        - Printer profiles and printer.cfg import
        - Calibration dialogs
        - User interface of the classic app
        - Cockpit and engine (developer preview)
        - Documentation and wiki
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation at the printer, not the feature. What goes wrong today, how often, on which machine?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should happen instead?
      description: The behaviour you propose. Screenshots, sketches or G-code examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Workarounds, macros, settings, other tools.
    validations:
      required: false
