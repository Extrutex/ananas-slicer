name: Crash report
description: ANANAS SLICER closes on its own, freezes or stops responding
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        A crash report is only useful with the files below. Please take two minutes to collect them; without a log or a project file the crash usually cannot be found.

        Crashes while opening a file from the internet are also security relevant. If you think the file was crafted to crash the program, report it privately instead: <https://github.com/Extrutex/ananas-slicer/security/advisories/new>.
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I have searched the existing issues
          required: true
        - label: I am on the latest release
          required: true
  - type: input
    id: version
    attributes:
      label: ANANAS SLICER version
      placeholder: e.g. 0.1.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Windows installer (.exe)
        - Windows portable (.zip)
        - macOS disk image (.dmg)
        - Linux AppImage
        - Flatpak
        - Built from source
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Computer
      description: CPU, graphics card and driver, memory. Many crashes are graphics-driver related.
      placeholder: e.g. Ryzen 7 5800X, Radeon RX 6700 (driver 25.9), 32 GB
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When does it crash?
      options:
        - Before the main window appears
        - While opening or importing a file
        - While slicing
        - While exporting or uploading G-code
        - In the G-code preview
        - In a calibration dialog
        - When connecting to the printer or on the Device tab
        - Somewhere else (describe below)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do right before the crash?
      description: Step by step. Does it crash every time?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log of the crashed session
      description: |
        Required. Logs live in the `log` folder of the settings directory:
        `%APPDATA%\AnanasSlicer\log` (Windows), `~/Library/Application Support/AnanasSlicer/log` (macOS), `~/.config/AnanasSlicer/log` (Linux). Take the newest file. Zip it if it is large.
    validations:
      required: true
  - type: textarea
    id: crashlog
    attributes:
      label: System crash report
      description: |
        macOS: `Console` → `Crash Reports` → the newest `AnanasSlicer` entry (or `~/Library/Logs/DiagnosticReports`). Windows: `Event Viewer` → `Windows Logs` → `Application`, the error with source `Application Error`. Linux: start the AppImage from a terminal and paste what it prints at the end.
    validations:
      required: false
  - type: textarea
    id: files
    attributes:
      label: Project or input file
      description: The `.3mf`, `.stl`, `.step` or `.gcode` file that was open. Zip files GitHub refuses.
    validations:
      required: false
