name: Bug report
description: Something behaves wrongly while ANANAS SLICER keeps running
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Three things first:

        - If ANANAS SLICER closes on its own, freezes or stops responding, use the **Crash report** form instead; it asks for the files a crash needs.
        - Questions and ideas belong in [Discussions](https://github.com/Extrutex/ananas-slicer/discussions).
        - Please search the open and closed issues before you file. If the problem is already there, comment on it; closed issues are reopened when a comment shows the problem is back.

        ANANAS SLICER is alpha software with a single maintainer. Reports with a project file and a log are answered first.
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I have searched the existing issues
          required: true
        - label: I am on the latest release (`Help` → `About ANANAS SLICER`, compare with the releases page)
          required: true
  - type: input
    id: version
    attributes:
      label: ANANAS SLICER version
      description: From `Help` → `About ANANAS SLICER`.
      placeholder: e.g. 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: regression
    attributes:
      label: Did it work in an earlier version?
      description: Name the version if you know one, or write KLIPSLICE or OrcaSlicer if the same project worked there.
      placeholder: e.g. KLIPSLICE 2026-10-01 build
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Windows installer (.exe)
        - Windows portable (.zip)
        - macOS disk image (.dmg)
        - Linux AppImage
        - Flatpak
        - Built from source
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Operating system version
      placeholder: e.g. Windows 11 24H2, macOS 15.6, Ubuntu 24.04
    validations:
      required: false
  - type: input
    id: printer
    attributes:
      label: Printer and kinematics
      description: The machine profile you selected, and the real machine if it differs.
      placeholder: e.g. Voron 2.4 350 (corexy), profile "Voron 2.4 350 0.4 nozzle"
    validations:
      required: true
  - type: input
    id: klipper
    attributes:
      label: Klipper and Moonraker versions
      description: Shown in Mainsail or Fluidd under Machine / Settings, or by `~/klipper/scripts/../klippy/klippy.py --version`. Write "not connected" if the problem happens without a printer.
      placeholder: e.g. Klipper v0.13.0-123-gabcdef, Moonraker v0.9.3-45
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Step by step, so that someone else can do the same and see the same.
      placeholder: |
        1. Open the attached project
        2. Slice plate
        3. Export G-code
        What happens: …
        What I expected: …
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Project file, G-code and printer.cfg
      description: |
        Drag the files here. The `.3mf` project (`File` → `Save project`) reproduces slicing problems; the exported `.gcode` shows what the printer received; the relevant sections of `printer.cfg` matter for anything about limits, pressure advance or macros. Zip files GitHub refuses.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        Drag the log of the session here. Logs live in the `log` folder of the settings directory:
        `%APPDATA%\AnanasSlicer\log` (Windows), `~/Library/Application Support/AnanasSlicer/log` (macOS), `~/.config/AnanasSlicer/log` (Linux).
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
    validations:
      required: false
