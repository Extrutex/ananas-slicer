version: 2
updates:
  # Only care about major updates to github actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore: # Only suggest major updates for built-in actions
      - dependency-name: "github/*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
  # Cockpit UI (developer preview): npm and cargo, security and major updates only.
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
  - package-ecosystem: "cargo"
    directory: "/ui/src-tauri"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
  # no support for c/cpp
