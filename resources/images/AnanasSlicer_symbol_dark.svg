<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>ANANAS SLICER symbol, direction A (Klipper-derived), dark background.</title>
  <!--
    Geometry (64 u grid, content box x 4..60, y 8..56):
    - body: the Klipper chevron (two arms, top edges y = x + 6 and y = 70 - x,
      16 u thick), sectioned by four horizontal 2 u gaps into five layers
      (y 10-15, 17-23, 25-31, 33-39, 41-48). The slice motif.
    - trace: the Klipper Y-path (7 u diagonals, 5 u stem, foot turning left),
