# KlipSlice print state macros for Klipper.
#
# Klipper keeps the values of SET_VELOCITY_LIMIT and SET_PRESSURE_ADVANCE until it
# restarts. A KlipSlice print sets the acceleration per feature (and the square
# corner velocity, minimum cruise ratio and pressure advance when the profile
# asks for them), so without a restore the end G-code and the next print would
# run with the values of the last feature.
#
# With "Restore Klipper state after the print" (klipper_restore_state) enabled
# in the printer settings, the G-code calls _KLIPSLICE_SAVE before the start
# G-code and _KLIPSLICE_RESTORE before the end G-code.
#
# Installation: copy this file next to printer.cfg and add
#
#     [include klipslice_state.cfg]
#
# A cancelled print never reaches the end G-code, so CANCEL_PRINT has to call
# _KLIPSLICE_RESTORE too. How depends on where CANCEL_PRINT comes from.
#
# With the macros of Mainsail or Fluidd ([include mainsail.cfg] or
# [include fluidd.cfg]), do not define a [gcode_macro CANCEL_PRINT] of your own:
# Klipper merges sections of the same name, the later gcode replaces the
# client's, and the heaters stay on after a cancel, because CANCEL_PRINT_BASE
# (Klipper's own CANCEL_PRINT) does not switch them off. Use the client's cancel
# hook instead, in the _CLIENT_VARIABLE macro of printer.cfg (the full template
# is at the top of mainsail.cfg/fluidd.cfg; variables left out keep their
# defaults):
#
#     [gcode_macro _CLIENT_VARIABLE]
#     variable_user_cancel_macro: "_KLIPSLICE_RESTORE"
#     gcode:
#
# The client's CANCEL_PRINT runs it after TURN_OFF_HEATERS and M106 S0, right
# before CANCEL_PRINT_BASE. The hook takes a single command; if it already
# calls a macro of yours, call _KLIPSLICE_RESTORE at the end of that macro.
#
# The client's CANCEL_PRINT parks (with park_at_cancel) and retracts
# (cancel_retract) before TURN_OFF_HEATERS. A G-code error there ends the
# macro with the heaters still on: a park position outside the axis limits
# (park_at_cancel_x/_y, custom_park_x/_y), or a cancel_retract longer than the
# extruder's max_extrude_only_distance. That is the client's macro, not this
# file; check those _CLIENT_VARIABLE values against printer.cfg.
#
# Without such a file, define CANCEL_PRINT so that it switches the heaters and
# the part cooling fan off and cancels the print before it restores. Call
# _KLIPSLICE_RESTORE last: a G-code error ends a macro, so whatever switches the
# heaters off and cancels the print has to run before anything that could fail.
# If printer.cfg already has a CANCEL_PRINT, add the last line to it instead.
#
#     [gcode_macro CANCEL_PRINT]
#     rename_existing: CANCEL_PRINT_BASE
#     gcode:
#         TURN_OFF_HEATERS
#         M107
#         CANCEL_PRINT_BASE
#         _KLIPSLICE_RESTORE
#
# _KLIPSLICE_RESTORE does nothing unless _KLIPSLICE_SAVE ran since the last
# restore, so calling it from CANCEL_PRINT is harmless for prints without
# klipper_restore_state, and for a second call after the end G-code. When a
# print ended without the restore, the next _KLIPSLICE_SAVE keeps the snapshot
# taken before it and prints a warning instead of recording that print's values.
#
# Requires a Klipper with minimum_cruise_ratio (v0.12.0 and later).

[gcode_macro _KLIPSLICE_SAVE]
description: Record the motion limits before a KlipSlice print changes them
variable_saved: False
variable_velocity: 0.0
variable_accel: 0.0
variable_minimum_cruise_ratio: 0.0
variable_square_corner_velocity: 0.0
gcode:
    # A snapshot that is still there belongs to an earlier print that ended
    # without _KLIPSLICE_RESTORE, typically a cancel that does not call it. The
    # toolhead now carries that print's feature values, so the snapshot stays.
    {% if saved %}
        {action_respond_info("_KLIPSLICE_SAVE: the motion limits saved before an earlier print were never restored; keeping them. Call _KLIPSLICE_RESTORE from CANCEL_PRINT (see klipslice_state.cfg).")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_KLIPSLICE_SAVE VARIABLE=velocity VALUE={printer.toolhead.max_velocity}
        SET_GCODE_VARIABLE MACRO=_KLIPSLICE_SAVE VARIABLE=accel VALUE={printer.toolhead.max_accel}
        SET_GCODE_VARIABLE MACRO=_KLIPSLICE_SAVE VARIABLE=minimum_cruise_ratio VALUE={printer.toolhead.minimum_cruise_ratio}
        SET_GCODE_VARIABLE MACRO=_KLIPSLICE_SAVE VARIABLE=square_corner_velocity VALUE={printer.toolhead.square_corner_velocity}
        SET_GCODE_VARIABLE MACRO=_KLIPSLICE_SAVE VARIABLE=saved VALUE=True
    {% endif %}

[gcode_macro _KLIPSLICE_RESTORE]
description: Restore the motion limits and the printer.cfg pressure advance after a KlipSlice print
gcode:
    {% set state = printer["gcode_macro _KLIPSLICE_SAVE"] %}
    {% if state.saved %}
        SET_GCODE_VARIABLE MACRO=_KLIPSLICE_SAVE VARIABLE=saved VALUE=False
        SET_VELOCITY_LIMIT VELOCITY={state.velocity} ACCEL={state.accel} MINIMUM_CRUISE_RATIO={state.minimum_cruise_ratio} SQUARE_CORNER_VELOCITY={state.square_corner_velocity}
        # Pressure advance belongs to the extruder steppers: the stepper of an
        # [extruder] or [extruderN] section, if it has one, and every
        # [extruder_stepper]. Klipper lists pressure_advance in
        # configfile.settings exactly for those, and registers each under the
        # last word of its section name as written in printer.cfg.
        # configfile.settings lower-cases section names: for two sections
        # that differ only in case it reports one of them under the shared
        # name, so neither value is known to be the section's own, and both
        # are left as they are.
        {% set settings = printer.configfile.settings %}
        {% for name in printer.configfile.config %}
            {% set words = name.split() %}
            {% set section = settings[name.lower()] if name.lower() in settings else {} %}
            {% if (name == "extruder" or (name.startswith("extruder") and name[8:].isdigit()) or (words|length > 1 and words[0] == "extruder_stepper")) and "pressure_advance" in section and "pressure_advance_smooth_time" in section %}
                {% set same = namespace(count=0) %}
                {% for other in printer.configfile.config %}
                    {% if other.lower() == name.lower() %}
                        {% set same.count = same.count + 1 %}
                    {% endif %}
                {% endfor %}
                {% if same.count > 1 %}
                    {action_respond_info("_KLIPSLICE_RESTORE: [%s] and another section differ only in case; Klipper reports one pressure advance for both, so it is not restored. Rename one of them." % name)}
                {% else %}
                    SET_PRESSURE_ADVANCE EXTRUDER={words[-1]} ADVANCE={section.pressure_advance} SMOOTH_TIME={section.pressure_advance_smooth_time}
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}
